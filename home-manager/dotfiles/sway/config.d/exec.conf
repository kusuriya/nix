# Session daemons are supervised by systemd user services in the Sway module.
# NixOS's /etc/sway/config.d integration imports the display environment and
# starts sway-session.target. Do not use exec_always for these daemons.

# ─── Session apps (launch once, assign rules route to workspaces) ───
exec vivaldi --silent-debugger
exec obsidian
exec hermes-desktop
exec chromium
exec discord
exec element-desktop
exec signal-desktop
